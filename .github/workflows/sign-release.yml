name: Sign Windows release
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Reviewed existing release tag (for example v1.3.0)
        required: true
        type: string
permissions:
  contents: read
  actions: read
jobs:
  sign:
    runs-on: windows-latest
    timeout-minutes: 35
    env:
      RELEASE_TAG: ${{ inputs.tag }}
    steps:
      - name: Require main branch and configured production signing
        shell: pwsh
        env:
          SIGNPATH_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
          SIGNPATH_ORG: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          SIGNPATH_PROJECT: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          SIGNPATH_POLICY: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
        run: |
          if ($env:GITHUB_REF -ne 'refs/heads/main') { throw 'Dispatch signing from main only.' }
          if ($env:RELEASE_TAG -notmatch '^v[0-9]+\.[0-9]+\.[0-9]+$') { throw 'Use an existing version tag such as v1.3.0.' }
          if (!$env:SIGNPATH_TOKEN -or !$env:SIGNPATH_ORG -or !$env:SIGNPATH_PROJECT -or !$env:SIGNPATH_POLICY) {
            throw 'Signing is not configured. SignPath approval and production credentials are required; no unsigned fallback is published.'
          }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: refs/tags/${{ inputs.tag }}
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: '10.0.x'
      - name: Publish reviewed source without private debug paths
        shell: pwsh
        run: |
          dotnet publish Sonora.csproj -c Release -r win-x64 --self-contained true -p:DebugType=None -p:ContinuousIntegrationBuild=true -o dist
          if ($LASTEXITCODE -ne 0) { throw 'Build failed.' }
      - name: Store unsigned build for provider provenance verification
        id: unsigned
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: Sonora-signing-input
          path: dist/Sonora.exe
          if-no-files-found: error
      - name: Request production signing (requires manual SignPath approval)
        uses: signpath/github-action-submit-signing-request@f6d04783b4569d051e0c80105fe66e82819d0092 # v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          github-artifact-id: ${{ steps.unsigned.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 1200
          output-artifact-directory: signed
      - name: Verify trusted Foundation signature and generate checksum
        shell: pwsh
        run: |
          $signature = Get-AuthenticodeSignature -LiteralPath signed/Sonora.exe
          if ($signature.Status -ne 'Valid' -or $signature.SignerCertificate.Subject -notmatch '(?:^|,\s*)CN=SignPath Foundation(?:,|$)') {
            throw 'The returned executable does not have the expected valid production signature.'
          }
          $hash = (Get-FileHash -LiteralPath signed/Sonora.exe -Algorithm SHA256).Hash.ToLowerInvariant()
          Set-Content -LiteralPath signed/SHA256SUMS.txt -Value "$hash  Sonora.exe" -Encoding ascii
      - name: Save signed artifact for owner review
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: Sonora-signed-windows-x64
          path: |
            signed/Sonora.exe
            signed/SHA256SUMS.txt
          if-no-files-found: error
