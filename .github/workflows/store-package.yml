name: Build Store validation package

on:
  workflow_dispatch:
  push:
    branches: [main, codex/store-signing-preparation]
    paths:
      - '**.cs'
      - '**.csproj'
      - '**.xaml'
      - 'Assets/**'
      - 'Packaging/**'
      - 'package-store.ps1'
      - '.github/workflows/store-package.yml'
  pull_request:
    paths:
      - '**.cs'
      - '**.csproj'
      - '**.xaml'
      - 'Assets/**'
      - 'Packaging/**'
      - 'package-store.ps1'
      - '.github/workflows/store-package.yml'

permissions:
  contents: read

jobs:
  draft:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: '10.0.x'
      - name: Build and unpack a draft MSIX; verify payload hashes
        shell: pwsh
        run: ./package-store.ps1 -Draft
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: SonarShift-Store-DRAFT-not-for-installation
          path: |
            dist/store/*.msix
            dist/store/*.sha256
            dist/store/*.build.json
          if-no-files-found: error
          retention-days: 7
      - name: Report validation scope
        shell: pwsh
        run: |
          'Draft MSIX structure and payload hashes verified. Identity is a placeholder. No installation, Store submission or certification was performed.' >> $env:GITHUB_STEP_SUMMARY
