name: Build Windows app
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - name: Publish self-contained Windows x64 app
        run: ./build.ps1
        shell: pwsh
      - name: Check preferences, migration, themes and profile cycling
        shell: pwsh
        run: |
          Start-Service AudioEndpointBuilder
          Start-Service Audiosrv
          $env:SONARSHIFT_TEST_DATA = Join-Path $env:RUNNER_TEMP 'signalshift-diagnostics'
          $report = Join-Path $PWD 'dist/features-report.json'
          $process = Start-Process ./dist/SignalShift.exe -ArgumentList @('--diagnostics','--headless','--report',('"' + $report + '"')) -PassThru -Wait
          if ($process.ExitCode -ne 0 -or !(Test-Path $report) -or !(Get-Content $report -Raw | ConvertFrom-Json).success) { throw 'Feature diagnostics failed.' }
          foreach ($theme in 'Dark','Light') {
            foreach ($page in 'Devices','Profiles','Shortcuts','Settings') {
              $path = Join-Path $PWD "dist/preview-$theme-$page.png"
              $preview = Start-Process ./dist/SignalShift.exe -ArgumentList @('--export-preview',('"' + $path + '"'),'--preview-theme',$theme,'--preview-page',$page) -PassThru -Wait
              if ($preview.ExitCode -ne 0 -or !(Test-Path $path)) { throw "Missing preview: $theme $page" }
            }
          }
          $maximized = Join-Path $PWD 'dist/preview-maximized.png'
          $windowCheck = Start-Process ./dist/SignalShift.exe -ArgumentList @('--export-preview',('"' + $maximized + '"'),'--preview-maximized') -PassThru -Wait
          if ($windowCheck.ExitCode -ne 0 -or !(Test-Path $maximized)) { throw 'Maximized window overlaps the monitor work area.' }
          Remove-Item Env:SONARSHIFT_TEST_DATA
          ./tools/Test-RetiredThemeHotkey.ps1 -Executable ./dist/SignalShift.exe -ReportPath ./dist/retired-theme-hotkey-report.json
          ./tools/Test-SettingsReload.ps1 -Executable ./dist/SignalShift.exe -ReportPath ./dist/settings-reload-report.json
          ./tools/Measure-Startup.ps1 -Executable ./dist/SignalShift.exe -ReportDirectory ./dist/startup-checks -Samples 2
          ./tools/Measure-DeviceRefresh.ps1 -Executable ./dist/SignalShift.exe -ReportDirectory ./dist/refresh-checks -AssertFastPath
      - name: Test release source and signature guards
        run: ./tools/Test-ReleaseAutomation.ps1 -ExePath dist/SignalShift.exe
        shell: pwsh
      - name: Verify repeated switch feedback allocation and native resource reuse
        shell: pwsh
        run: |
          ./tools/Test-SwitchAllocations.ps1 -Executable dist/SignalShift.exe -ReportPath dist/switch-allocation-report.json
          ./tools/Test-SwitchAllocations.ps1 -Executable dist/SignalShift.exe -ReportPath dist/switch-allocation-long.json -LongRun
      - uses: actions/upload-artifact@v7
        with:
          name: SignalShift-windows-x64
          path: |
            dist/SignalShift.exe
            dist/SHA256SUMS.txt
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: SonarShift-switch-allocation-checks
          path: dist/switch-allocation-*.json
          if-no-files-found: warn
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: SignalShift-feature-review
          path: |
            dist/features-report.json
            dist/retired-theme-hotkey-report.json
            dist/settings-reload-report.json
            dist/preview-*.png
            dist/startup-checks/samples.json
            dist/refresh-checks/results.json
