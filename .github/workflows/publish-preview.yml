name: Publish owner-requested unsigned preview
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Preview tag (preview-2.4.0)
        required: true
      build_run_id:
        description: Successful main-branch Build Windows app run
        required: true
permissions:
  contents: read
concurrency:
  group: preview-${{ inputs.tag }}
  cancel-in-progress: false
jobs:
  publish:
    if: github.ref == 'refs/heads/main' && github.actor == github.repository_owner
    runs-on: windows-latest
    timeout-minutes: 15
    permissions:
      actions: read
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ inputs.tag }}
      BUILD_RUN_ID: ${{ inputs.build_run_id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Require reviewed main source, successful build and existing preview draft
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:RELEASE_TAG -cnotmatch '^preview-(\d+\.\d+\.\d+)$') { throw 'Only preview tags are permitted.' }
          $version = $Matches[1]
          if ($env:BUILD_RUN_ID -notmatch '^\d+$') { throw 'Invalid build run ID.' }
          $run = gh api "repos/$env:GITHUB_REPOSITORY/actions/runs/$env:BUILD_RUN_ID" | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0 -or $run.conclusion -ne 'success' -or $run.event -ne 'push' -or $run.head_branch -ne 'main' -or $run.path -ne '.github/workflows/build.yml' -or $run.repository.full_name -cne $env:GITHUB_REPOSITORY -or $run.head_sha -notmatch '^[0-9a-f]{40}$') { throw 'Build is not a successful trusted main build.' }
          git merge-base --is-ancestor $run.head_sha origin/main
          if ($LASTEXITCODE -ne 0) { throw 'Source is not reachable from main.' }
          [xml]$project = git show "$($run.head_sha):SignalShift.csproj"
          if ($LASTEXITCODE -ne 0 -or $project.Project.PropertyGroup.Version -ne $version) { throw 'Version differs from preview tag.' }
          $release = gh release view $env:RELEASE_TAG --repo $env:GITHUB_REPOSITORY --json isDraft,isPrerelease,targetCommitish | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0 -or !$release.isDraft -or !$release.isPrerelease -or $release.targetCommitish -cne $run.head_sha) { throw 'An owner-prepared preview draft targeting the exact source is required.' }
          "PREVIEW_SOURCE=$($run.head_sha)" >> $env:GITHUB_ENV
          "PREVIEW_VERSION=$version" >> $env:GITHUB_ENV
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: SignalShift-windows-x64
          path: preview
          run-id: ${{ inputs.build_run_id }}
          github-token: ${{ github.token }}
      - name: Verify exact assets and checksum, stage draft, then publish prerelease
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $files = @(Get-ChildItem preview -Recurse -File)
          if ($files.Count -ne 2 -or (($files.Name | Sort-Object) -join ',') -cne 'SHA256SUMS.txt,SignalShift.exe') { throw 'Unexpected files in executable artifact.' }
          $exe = Get-Item preview/SignalShift.exe
          if ($exe.VersionInfo.FileVersion -ne "$env:PREVIEW_VERSION.0" -or $exe.VersionInfo.ProductName -ne 'SignalShift') { throw 'Unexpected executable metadata.' }
          $hash = (Get-FileHash $exe.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          if ((Get-Content preview/SHA256SUMS.txt -Raw).Trim() -cne "$hash  SignalShift.exe") { throw 'Artifact checksum mismatch.' }
          $assets = @('preview/SignalShift.exe', 'preview/SHA256SUMS.txt')
          gh release upload $env:RELEASE_TAG @assets --repo $env:GITHUB_REPOSITORY --clobber
          if ($LASTEXITCODE -ne 0) { throw 'Draft asset upload failed.' }
          $release = gh release view $env:RELEASE_TAG --repo $env:GITHUB_REPOSITORY --json isDraft,isPrerelease,assets | ConvertFrom-Json
          $remote = @($release.assets | Where-Object name -CEQ 'SignalShift.exe')
          if ($LASTEXITCODE -ne 0 -or !$release.isDraft -or !$release.isPrerelease -or $release.assets.Count -ne $assets.Count -or $remote.Count -ne 1 -or $remote[0].size -ne $exe.Length -or $remote[0].digest -cne "sha256:$hash") { throw 'Uploaded executable integrity check failed; draft retained.' }
          foreach ($asset in $assets) {
            $local = Get-Item $asset
            $uploaded = @($release.assets | Where-Object name -CEQ $local.Name)
            $digest = (Get-FileHash $local.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($uploaded.Count -ne 1 -or $uploaded[0].size -ne $local.Length -or $uploaded[0].digest -cne "sha256:$digest") { throw "Uploaded asset mismatch: $($local.Name); draft retained." }
          }
          gh release edit $env:RELEASE_TAG --repo $env:GITHUB_REPOSITORY --draft=false --prerelease --latest=false
          if ($LASTEXITCODE -ne 0) { throw 'Preview publication failed.' }
          "Published unsigned preview $env:RELEASE_TAG from $env:PREVIEW_SOURCE; SHA-256 $hash. This is not a signed stable release." >> $env:GITHUB_STEP_SUMMARY
