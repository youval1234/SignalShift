name: Validate optimization and measure Windows footprint
on:
  workflow_dispatch:
  push:
    branches: [codex/optimize-1.5]
permissions:
  contents: read
jobs:
  measure:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          path: app
      - uses: actions/checkout@v7
        with:
          ref: cc8bbc526eeda68be1f7efe0b81dbd37bb6e122f
          path: baseline
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - name: Enable Windows audio services for callback integration tests
        shell: pwsh
        run: |
          Start-Service AudioEndpointBuilder
          Start-Service Audiosrv
      - name: Build isolated 1.4 baseline without altering its audio/UI implementation
        shell: pwsh
        working-directory: baseline
        run: |
          $file = Join-Path $PWD 'Models.cs'
          $text = [IO.File]::ReadAllText($file).Replace('public static string DirectoryPath => Path.Combine(Environment.GetFolderPath(Environment.SpecialFolder.LocalApplicationData), "Sonora");', 'public static string DirectoryPath => Environment.GetEnvironmentVariable("SONARSHIFT_TEST_DATA") ?? Path.Combine(Environment.GetFolderPath(Environment.SpecialFolder.LocalApplicationData), "Sonora");')
          [IO.File]::WriteAllText($file, $text)
          dotnet publish SonarShift.csproj -c Release -r win-x64 --self-contained true -o ../baseline-output
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build optimized self-contained and framework-dependent variants
        shell: pwsh
        working-directory: app
        run: |
          dotnet publish SignalShift.csproj -c Release -r win-x64 --self-contained true -o ../optimized-output
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet publish SignalShift.csproj -c Release -r win-x64 --self-contained true -p:EnableCompressionInSingleFile=true -o ../compact-output
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet publish SignalShift.csproj -c Release -r win-x64 --self-contained false -p:PublishSingleFile=false -p:EnableCompressionInSingleFile=false -o ../framework-output
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $files = Get-ChildItem ../framework-output -Recurse -File
          [pscustomobject]@{ frameworkDependentBytes=($files | Measure-Object Length -Sum).Sum; files=@($files | Select-Object Name,Length) } | ConvertTo-Json -Depth 4 | Set-Content ../framework-size.json
      - name: Compare narrow and full SDK startup activation outside a package
        shell: pwsh
        working-directory: app
        run: |
          dotnet publish tests/StartupProbe/StartupProbe.csproj -c Release -r win-x64 --self-contained true -o ../startup-narrow
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet publish tests/StartupProbe/StartupProbe.csproj -c Release -r win-x64 --self-contained true -p:FullSdk=true -o ../startup-full
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & ../startup-narrow/StartupProbe.exe ../startup-narrow.json
          & ../startup-full/StartupProbe.exe ../startup-full.json
          $narrow = Get-Content ../startup-narrow.json -Raw | ConvertFrom-Json
          $full = Get-Content ../startup-full.json -Raw | ConvertFrom-Json
          $narrow, $full | ConvertTo-Json
          if ($narrow.hresult -ne $full.hresult -or $narrow.errorType -match 'TypeLoad|MissingMethod|FileNotFound') { throw 'Narrow startup projection differs from the full SDK.' }
          Write-Host 'Packaged startup consent still requires validation in the signed Store package.'
      - name: Run application diagnostics without claiming physical audio-device tests
        shell: pwsh
        run: |
          $report = Join-Path $PWD 'diagnostics.json'
          $process = Start-Process -FilePath optimized-output/SignalShift.exe -ArgumentList @('--diagnostics','--headless','--report',('"' + $report + '"')) -PassThru
          if (!$process.WaitForExit(60000)) { throw 'Diagnostics timed out.' }
          $result = Get-Content -LiteralPath $report -Raw | ConvertFrom-Json
          $result.checks | Where-Object test | Format-Table test,passed
          if ($process.ExitCode -ne 0 -or !$result.success) { throw ($result | ConvertTo-Json -Depth 6) }
      - name: Measure footprint and verify background/UI lifecycle
        shell: pwsh
        run: ./app/tools/Test-Optimization.ps1 -OptimizedExe ./optimized-output/SignalShift.exe -BaselineExe ./baseline-output/SonarShift.exe -ReportDirectory ./performance -SampleSeconds 20
      - name: Compare combined host and interface memory with and without bundle compression
        shell: pwsh
        run: |
          ./app/tools/Measure-InterfaceFootprint.ps1 -Executable ./compact-output/SignalShift.exe -ReportPath ./performance/interface-compact.json -SampleSeconds 10
          ./app/tools/Measure-InterfaceFootprint.ps1 -Executable ./optimized-output/SignalShift.exe -ReportPath ./performance/interface-default.json -SampleSeconds 10
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: optimization-measurements
          path: |
            performance/**/*.json
            diagnostics.json
            framework-size.json
            startup-*.json
